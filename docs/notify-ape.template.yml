name: notify-APE
# TEMPLATE â€” copy to: genesis, experience-validation-engine, ADAM, skein, EVE---MIRO
# as .github/workflows/notify-APE.yml, then set REPO_NAME below per repo:
#   genesis | eve | adam | skein
# Requires secret APE_SYNC_TOKEN in the source repo (PAT with contents:write on APE).
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APE_SYNC_TOKEN }}
          repository: fernandogarzaaa/ape-mcp
          event-type: source-updated
          client-payload: '{"repo": "REPO_NAME", "sha": "${{ github.sha }}"}'
