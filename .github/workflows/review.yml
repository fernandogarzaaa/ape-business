name: review
# Automatic code review: request a Copilot review on every ready PR so nothing
# merges without an automated first pass (branch protection still requires a
# human approval + green CI before merge).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: write
jobs:
  copilot:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot code review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Documented reviewer login for API review requests. Requires Copilot
          # code review enabled for the account/repo; otherwise GitHub accepts
          # the request but attaches nothing (fallback keeps the job green —
          # branch protection still enforces human review + CI).
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' \
            || echo "copilot review unavailable; human review still required by branch protection"
