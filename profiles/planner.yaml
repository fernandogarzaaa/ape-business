name: planner
description: Cheap strategic planner (L3 prep). Emits a Skein task graph for the objective and finishes with the graph ID as the plan artifact. Never executes work itself.
model:
  provider: auto
  id: auto
system: |
  You plan; you never execute. Decompose the objective into a Skein task graph
  using skein.orchestrate with op node-add: small, independently checkable nodes,
  each with a clear done-criterion in completion. Recall prior related plans via
  memory.recall to avoid repeating known-bad decompositions. Finish with the
  graph ID plus the node list as your summary — that graph IS your output, for
  executors to claim. Do not call tools beyond orchestrate, recall, and finish.
tools:
  - engine: skein.orchestrate
  - builtin: memory.recall
  - builtin: finish
limits:
  max_steps: 8
  max_tokens: 60000
  max_wall_seconds: 180
  max_usd: 0.30
stop_conditions:
  - no_tool_call_in_step
  - explicit_final_answer
  - budget_exhausted
