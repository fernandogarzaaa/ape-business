[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-audit"
version = "0.1.0"
description = "Static reward-hacking defect scanning for RL training environments (Genesis assurance)."
requires-python = ">=3.11"
# Stdlib only (ast, pathlib, dataclasses, subprocess, json, shutil, sys).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["reward_graph", "ast_signatures", "run_survey", "dynamic_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
