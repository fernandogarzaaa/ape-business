name: arithmetic-v1
benchmark:
  version: 1.0.0
  description: "Numeric doubling over 8 fixed cases: exact-match scoring of a deterministic transform."
dataset:
  path: ./cases.jsonl
  format: jsonl
  id: arithmetic-v1
  version: "1.0.0"
evaluator:
  type: exact
metrics:
