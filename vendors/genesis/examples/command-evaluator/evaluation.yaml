name: doubling-with-custom-judge
claim:
  id: claim-ce-001
  statement: "The Node doubling subject satisfies a tolerance-checking custom judge on every case."
  hypothesis:
    primary:
      metric: task_success
      operator: ">="
      threshold: 1.0
  methodology:
    paired: true
    repetitions: 1
    minimum_samples: 8
  evaluation:
    metrics:
      - task_success
dataset:
  path: ./examples/arithmetic/cases.jsonl
  format: jsonl
  id: arithmetic-cases
  version: "1"
subject:
  name: node-doubler
  command: "node ./examples/command-evaluator/subject.mjs {task_file}"
  timeout_ms: 10000
evaluator:
  type: command
  command: "node ./examples/command-evaluator/evaluator.mjs {task_file} {output_file}"
metrics:
  - task_success
repetitions: 1
paired: true
thresholds:
  task_success: ">=1.0"
